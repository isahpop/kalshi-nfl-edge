name: Collect Kalshi public NFL prices
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-kalshi-quote-collector
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot public Kalshi quotes
        run: node scripts/collect-quotes.mjs
      - name: Commit new observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots public/data/kalshi-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive public Kalshi NFL quotes [skip ci]'
            git push
          else
            echo 'No changes to commit'
          fi
